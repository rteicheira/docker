# Autoheal: https://github.com/willfarrell/docker-autoheal/blob/main/README.md
#   Container: https://hub.docker.com/r/willfarrell/autoheal/
#   GitHub Project: https://github.com/willfarrell/docker-autoheal

services:
  autoheal:
    image: willfarrell/autoheal:latest
    container_name: autoheal
    restart: unless-stopped
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
